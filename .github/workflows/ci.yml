name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, Feature/AgentGuard]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/AgentGuard.sln

      - name: Build
        run: dotnet build backend/AgentGuard.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/AgentGuard.sln --no-build --configuration Release

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

  deploy:
    name: Deploy (Render)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # No-ops until RENDER_FRONTEND_DEPLOY_HOOK_URL is added, e.g. before the frontend service
      # exists in Render yet (it's created by a Blueprint sync, not by this workflow).
      - name: Trigger Render frontend deploy
        env:
          FRONTEND_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$FRONTEND_HOOK_URL" ]; then
            curl --fail --silent --show-error -X POST "$FRONTEND_HOOK_URL"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK_URL not set yet — skipping."
          fi
