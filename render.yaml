services:
  - type: web
    name: agentguard-api
    runtime: docker
    repo: https://github.com/mailchitkara/AI_SDLC_SPECKIT
    branch: main
    # Deploys are triggered explicitly by the GitHub Actions "deploy" job (ci.yml), gated on
    # the build/test jobs succeeding — not by Render watching pushes to this branch itself.
    autoDeploy: false
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: FRONTEND_ORIGIN
        # fromService/property:host resolves to Render's internal private-network hostname, not
        # the public *.onrender.com URL a browser's Origin header actually sends — hardcoded
        # instead, same as VITE_API_BASE_URL below.
        value: https://agentguard-frontend-grar.onrender.com

  - type: web
    name: agentguard-frontend
    runtime: static
    repo: https://github.com/mailchitkara/AI_SDLC_SPECKIT
    branch: main
    # See agentguard-api above for why this is off — the GitHub Actions "deploy" job triggers
    # deploys explicitly once CI passes, rather than Render watching pushes itself.
    autoDeploy: false
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agentguard-api-ifb3.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
